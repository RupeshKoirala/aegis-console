<h1>Verdict lookup</h1>
<div class="row">
  <input class="q mono" [value]="query()" (input)="query.set($any($event.target).value)" placeholder="IP or domain" />
  <label class="row"><input type="checkbox" [checked]="slow()" (change)="slow.set(!slow())" /> slow network</label>
</div>
