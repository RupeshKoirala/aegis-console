<h1>Verdict lookup</h1>
<div class="row">
  <input class="q mono" [value]="query()" (input)="query.set($any($event.target).value)" placeholder="IP or domain" />
  <label class="row"><input type="checkbox" [checked]="slow()" (change)="slow.set(!slow())" /> slow network</label>
</div>

<section class="card result">
  @if (verdict.isLoading()) {
    <p class="loading muted">Checking {{ query() }}…</p>
  } @else if (verdict.error()) {
    <p class="error error-text">Lookup failed. <button class="retry" (click)="verdict.reload()">Retry</button></p>
  } @else if (verdict.hasValue()) {
    @let v = verdict.value();
    <h2><span class="pill" [class]="v.verdict">{{ v.verdict }}</span> <span class="reason">{{ v.reason }}</span></h2>
    <p class="muted">{{ v.matches.length }} matching list entries</p>
  } @else {
    <p class="idle muted">Type something to check.</p>
  }
</section>
