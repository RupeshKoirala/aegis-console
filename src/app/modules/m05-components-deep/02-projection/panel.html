<section class="panel" [class.danger]="tone() === 'danger'">
  <header class="panel-head">
    <ng-content select="[panelTitle]" />
    @if (actionNames().length) {
      <span class="action-count muted">{{ actionNames().length }} actions</span>
    }
  </header>
  <div class="panel-body">
    <ng-content />
  </div>
  <footer class="panel-foot">
    <ng-content select="[panelFooter]"><span class="fallback muted">Last updated just now</span></ng-content>
  </footer>
</section>
