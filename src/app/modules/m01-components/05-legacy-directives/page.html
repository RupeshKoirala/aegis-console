<h1>Alert queue <small class="muted">(Gen 1 style)</small></h1>

<div class="row toolbar">
  @for (s of filters; track s) {
    <button class="filter" [class.on]="filter === s" (click)="filter = s; selected = null">{{ s }}</button>
  }
</div>

<ng-container *ngIf="visibleAlerts.length; else noAlerts">
  <table class="card">
    <thead><tr><th>#</th><th>Severity</th><th>Alert</th><th>Status</th></tr></thead>
    <tbody>
      <tr *ngFor="let a of visibleAlerts; let i = index; let odd = odd; trackBy: trackById"
          class="alert-row" [ngClass]="{ odd: odd, resolved: a.status === 'RESOLVED' }" (click)="selected = a">
        <td class="n">{{ i + 1 }}</td>
        <td><span [ngClass]="['sev', a.severity]">{{ a.severity }}</span></td>
        <td>{{ a.title }}</td>
        <td [ngSwitch]="a.status">
          <span *ngSwitchCase="'NEW'" class="icon">🆕</span>
          <span *ngSwitchCase="'TRIAGED'" class="icon">🔎</span>
          <span *ngSwitchDefault class="icon">✅</span>
          <span class="status" [ngStyle]="{ 'background-color': statusColors[a.status] }">{{ a.status }}</span>
        </td>
      </tr>
    </tbody>
  </table>
</ng-container>
<ng-template #noAlerts><p class="none muted">No alerts with status {{ filter }}</p></ng-template>

<p class="selected" *ngIf="selected as s">Selected: <strong>{{ s.title }}</strong> (assignee: {{ s.assignee || 'nobody' }})</p>
