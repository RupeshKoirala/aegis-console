<h1>Alert queue <small class="muted">(Gen 1 style)</small></h1>

<div class="row toolbar">
  @for (s of filters; track s) {
    <button class="filter" [class.on]="filter === s" (click)="filter = s; selected = null">{{ s }}</button>
  }
</div>

          *ngFor="let a of visibleAlerts; let i = index; let odd = odd; trackBy: trackById"

          *ngSwitchDefault ✅  (each a <span class="icon">)
  TODO 6: the status pill:  [ngStyle]="{ 'background-color': statusColors[a.status] }"
  TODO 7: below the table:  <p class="selected" *ngIf="selected as s">Selected: <strong>{{ s.title }}</strong>

<table class="card">
  <thead><tr><th>#</th><th>Severity</th><th>Alert</th><th>Status</th></tr></thead>
  <tbody>
    <tr class="alert-row">
      <td class="n">1</td>
      <td><span class="sev CRITICAL">CRITICAL</span></td>
      <td>Blocked traffic to 203.0.113.66 (Botnets)</td>
      <td><span class="icon">🆕</span><span class="status">NEW</span></td>
    </tr>
  </tbody>
</table>
