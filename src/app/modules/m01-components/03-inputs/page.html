<h1>Indicator cards</h1>

<h3>Gen 3 · signal inputs</h3>
<section class="grid signal-cards">
  @for (i of withDescription; track i.id) {
    <aegis-indicator-card [indicator]="i" [kind]="kindOf(i)" maxDescription="24" />
  }
  @for (i of threats; track i.id) {
    <aegis-indicator-card [indicator]="i" [kind]="kindOf(i)" />
  }
  <aegis-indicator-card class="compact-one" [indicator]="threats[0]" kind="THREAT" compact />
</section>

<h3>Gen 1 · &#64;Input decorators</h3>
<section class="grid legacy-cards">
  @for (i of withDescription; track i.id) {
    <aegis-legacy-indicator-card [indicator]="i" [kind]="kindOf(i)" maxDescription="24" />
  }
</section>
