<form class="card planner-form" #form="ngForm" (ngSubmit)="submit()">
  <div><label for="lcs">Current entries</label><input id="lcs" name="currentSize" type="number" [(ngModel)]="currentSize" /></div>
  <div><label for="lda">New per day</label><input id="lda" name="dailyAdditions" type="number" [(ngModel)]="dailyAdditions" /></div>
  <div><label for="lgr">Growth / month (%)</label><input id="lgr" name="monthlyGrowthPct" type="number" [(ngModel)]="monthlyGrowthPct" /></div>
  <div><label for="lex">Avg. expiry (days)</label><input id="lex" name="expiryDays" type="number" [(ngModel)]="expiryDays" /></div>
  <div><label for="lmo">Months</label><input id="lmo" name="months" type="number" [(ngModel)]="months" /></div>
  <div class="actions">
    <button type="button" class="reset" (click)="form.resetForm(defaults)">Reset</button>
    <button type="submit" class="primary">Project</button>
  </div>
</form>
