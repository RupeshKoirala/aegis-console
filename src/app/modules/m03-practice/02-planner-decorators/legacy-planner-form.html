<!--
  TODO 3: give the <form> a template reference to the NgForm directive:  #form="ngForm"
          and two-way bind each input to its PLAIN field: [(ngModel)]="currentSize" (no parentheses, it's not a signal)
  TODO 4: the Reset button:  (click)="form.resetForm(defaults)"
-->
<form class="card planner-form" (ngSubmit)="submit()">
  <div><label for="lcs">Current entries</label><input id="lcs" name="currentSize" type="number" value="250000" /></div>
  <div><label for="lda">New per day</label><input id="lda" name="dailyAdditions" type="number" value="4000" /></div>
  <div><label for="lgr">Growth / month (%)</label><input id="lgr" name="monthlyGrowthPct" type="number" value="10" /></div>
  <div><label for="lex">Avg. expiry (days)</label><input id="lex" name="expiryDays" type="number" value="90" /></div>
  <div><label for="lmo">Months</label><input id="lmo" name="months" type="number" value="12" /></div>
  <div class="actions">
    <button type="button" class="reset">Reset</button>
    <button type="submit" class="primary">Project</button>
  </div>
</form>
