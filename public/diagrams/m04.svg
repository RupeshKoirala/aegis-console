<text class="note" x="34" y="428">1. Read an error top-down: code (NG0xxx) → message → the FIRST stack frame inside src/app. Click it; source maps open your .ts file.</text>
<text class="note" x="34" y="447">2. A logic bug throws nothing. Shrink the input until the spec still fails, then step through decide() with a breakpoint.</text>
<text class="note" x="34" y="466">3. The bug branch for this module has 12 commits. git bisect finds the one that broke the threshold.</text>
