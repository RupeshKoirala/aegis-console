<text class="title" x="34" y="40">M04 · Debugging: where each bug hides</text>
<text class="lead" x="34" y="64">Every bug has a layer. The compiler catches template typos, the console catches runtime crashes, and only tests and</text>
<text class="lead" x="34" y="82">breakpoints catch wrong-but-quiet logic.</text>
