<rect class="bg" width="1000" height="763" rx="12"/>
<text class="title" x="34" y="40">M06 · Directives: behaviour without a template</text>
<text class="lead" x="34" y="64">A directive attaches to an element someone else renders. Attribute directives change it, structural ones create or</text>
<text class="lead" x="34" y="82">remove it, and hostDirectives bolt several onto one component.</text>
<rect class="group" x="20" y="96" width="224" height="224" rx="10"/><text class="gl" x="30" y="112">01 attribute</text>
<rect class="group" x="260" y="96" width="224" height="224" rx="10"/><text class="gl" x="270" y="112">02 exportAs</text>
<rect class="group" x="500" y="96" width="464" height="342" rx="10"/><text class="gl" x="510" y="112">03 structural *aegisHasRole</text>
<rect class="group" x="20" y="332" width="464" height="224" rx="10"/><text class="gl" x="30" y="348">04 hostDirectives</text>
