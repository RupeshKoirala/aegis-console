<text class="note" x="34" y="664">1. Desugar it: *aegisHasRole="'ADMIN'" becomes &lt;ng-template [aegisHasRole]="'ADMIN'"&gt;. The directive decides how many times (0 or 1) to</text>
<text class="note" x="50" y="683">stamp that template.</text>
<text class="note" x="34" y="702">2. Every role change must clear() before creating: otherwise views pile up. Watch the DOM in Elements while you switch roles.</text>
<text class="note" x="34" y="721">3. Angular DevTools lists directives under the element that hosts them. Click a chip: you see IndicatorChip, Tooltip and Focusable on</text>
<text class="note" x="50" y="740">one node.</text>
