<text class="title" x="34" y="40">M07 · Pipes: format in the template, cache by input</text>
<text class="lead" x="34" y="64">value | pipe:arg is a function call the compiler wires for you. A pure pipe re-runs only when its input REFERENCE</text>
<text class="lead" x="34" y="82">changes; an impure one runs on every check.</text>
