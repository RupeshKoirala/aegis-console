<text class="note" x="34" y="546">1. Angular DevTools → select a counter → "Injector Tree" tab: you see exactly which injector resolved CounterService.</text>
<text class="note" x="34" y="565">2. 03 (resolution modifiers) is the same walk with rules: optional (null if missing), self (only my element), skipSelf (start at my</text>
<text class="note" x="50" y="584">parent), host (stop at my host).</text>
<text class="note" x="34" y="603">3. Delete a providers entry and the error is NG0201 "No provider found". Read the path it prints: that is the walk.</text>
