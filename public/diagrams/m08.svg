<rect class="bg" width="1000" height="626" rx="12"/>
<text class="title" x="34" y="40">M08 · Dependency injection: who gets which instance</text>
<text class="lead" x="34" y="64">inject(X) walks UP the tree: own element → parents → route/environment → root. The first injector that provides X wins,</text>
<text class="lead" x="34" y="82">so where you write providers decides who shares.</text>
<rect class="group" x="20" y="96" width="464" height="342" rx="10"/><text class="gl" x="30" y="112">01 injector tree</text>
<rect class="group" x="500" y="96" width="224" height="342" rx="10"/><text class="gl" x="510" y="112">02 providers &amp; tokens</text>
<rect class="group" x="740" y="96" width="224" height="342" rx="10"/><text class="gl" x="750" y="112">04 multi providers</text>
