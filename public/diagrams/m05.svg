<text class="title" x="34" y="40">M05 · Components deep dive</text>
<text class="lead" x="34" y="64">Six ways a component reaches beyond its own template: its host element, projected content, styles, its lifetime,</text>
<text class="lead" x="34" y="82">templates handed in as data, and children it queries.</text>
