<text class="note" x="34" y="664">1. In Chrome Elements, compare the attributes on &lt;aegis-severity-badge&gt; (_nghost/_ngcontent) with the #shadow-root of</text>
<text class="note" x="50" y="683">&lt;aegis-shadow-badge&gt;. That is encapsulation, made visible.</text>
<text class="note" x="34" y="702">2. model() only notifies the parent when you SET a new value. Mutating the array in place (push) changes nothing the parent can see.</text>
<text class="note" x="34" y="721">3. Toggle the HookProbe and watch LifecycleLog: constructor → ngOnInit → afterNextRender → … → onDestroy.</text>
