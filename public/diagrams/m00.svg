<text class="note" x="34" y="664">1. Nothing in indicator-utils.ts knows about Angular: plain functions are the easiest code to test and debug. Put a breakpoint in</text>
<text class="note" x="50" y="683">classify() and type in the page.</text>
<text class="note" x="34" y="702">2. A standalone component only sees what it lists in imports: [...]. Forget one and the compiler says NG8001 "is not a known element".</text>
<text class="note" x="34" y="721">3. Open Angular DevTools → Components: the tree you see there is exactly the "renders" arrows on this map.</text>
