<rect class="bg" width="1000" height="607" rx="12"/>
<text class="title" x="34" y="40">M09 · Change detection: who re-renders, and when</text>
<text class="lead" x="34" y="64">OnPush components re-check only when an input REFERENCE changes, an event fires inside them, or a signal they read</text>
<text class="lead" x="34" y="82">changes. Zoneless apps rely on exactly these signals.</text>
<rect class="group" x="20" y="96" width="464" height="224" rx="10"/><text class="gl" x="30" y="112">01 OnPush mechanics</text>
<rect class="group" x="500" y="96" width="224" height="224" rx="10"/><text class="gl" x="510" y="112">02 render cost</text>
<rect class="group" x="740" y="96" width="224" height="342" rx="10"/><text class="gl" x="750" y="112">03 ChangeDetectorRef</text>
<rect class="group" x="20" y="332" width="704" height="106" rx="10"/><text class="gl" x="30" y="348">04 zoneless</text>
