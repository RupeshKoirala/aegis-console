<text class="note" x="34" y="546">1. Mutate alert.status in place and the OnPush card stays stale: same reference, nothing to compare. Replace the object instead.</text>
<text class="note" x="34" y="565">2. Angular DevTools → Profiler → record, click, stop: each bar is one change-detection pass; the flame chart shows which components</text>
