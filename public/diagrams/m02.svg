<text class="title" x="34" y="40">M02 · NgModules → standalone</text>
<text class="lead" x="34" y="64">Gen 1 apps group components into NgModules: declarations are private, exports are public. Standalone components skip the</text>
<text class="lead" x="34" y="82">middleman and import exactly what they use.</text>
<rect class="group" x="20" y="96" width="704" height="342" rx="10"/><text class="gl" x="30" y="112">01 build a feature with NgModules</text>
<rect class="group" x="740" y="96" width="224" height="342" rx="10"/><text class="gl" x="750" y="112">02 migrate to standalone</text>
