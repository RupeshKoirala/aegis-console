<text class="note" x="34" y="546">1. Follow a name: UserTable uses | initials. That works only because AdminModule imports SharedModule, which EXPORTS InitialsPipe.</text>
<text class="note" x="50" y="565">Break any link → NG8004 "No pipe found".</text>
<text class="note" x="34" y="584">2. After migration (right column) the arrows go straight from user to dependency. No module in between: that is the whole point.</text>
<text class="note" x="34" y="603">3. In Angular DevTools a component shows its standalone flag; NgModule-declared ones do not.</text>
