<text class="title" x="34" y="40">M01 · Components &amp; templates: how the pieces talk</text>
<text class="lead" x="34" y="64">Data flows DOWN through inputs (blue). Events flow UP through outputs (green). A service shares state SIDEWAYS between</text>
<text class="lead" x="34" y="82">components that are not parent and child (purple, via inject()).</text>
