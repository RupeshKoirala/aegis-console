<text class="note" x="34" y="782">1. Inputs are read-only signals inside the child: card.indicator() — the child never writes them.</text>
<text class="note" x="34" y="801">2. model() is an input AND an output in one: [(level)] keeps parent and child in sync (the double-headed arrow).</text>
<text class="note" x="34" y="820">3. WatchlistService is providedIn: "root", so picker and panel get the SAME instance. Change its signal immutably or nobody re-renders.</text>
